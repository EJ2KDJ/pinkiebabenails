<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a0a12" />
    <title>Nail Gallery | PinkieBabe Nails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <script src="js/auth-session.js"></script>
    <script src="js/slideshow.js" defer></script>
    <script src="js/auth-nav.js" defer></script>
</head>

<body>
    <header class="site-header">
        <a class="site-brand" href="index.html" aria-label="PinkieBabe Nails home">
            <img src="assets/Logo%20Nail%20salon.jpg" alt="PinkieBabe Nails" />
        </a>
        <input class="nav-toggle" type="checkbox" id="nav-toggle" />
        <label class="nav-toggle-button" for="nav-toggle">
            <span></span>
            <span></span>
            <span></span>
            <span class="visually-hidden">Toggle navigation</span>
        </label>
        <nav class="site-nav" aria-label="Main navigation">
            <a class="link" href="index.html">Home</a>
            <a class="link" href="about.html">About Us</a>
            <a class="link" href="gallery.html" aria-current="page">Gallery</a>
            <a class="link book-link" href="book.html">Book</a>
            <a class="link" href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="page-header">
        <p class="eyebrow">PinkieBabe Nails</p>
        <h1>Nail Gallery</h1>
        <p>A look at some of our recent nail designs.</p>
    </section>

    <main class="content-section">
        <div class="gallery-carousel" role="region" aria-roledescription="carousel" aria-label="Nail design gallery">
            <div class="gallery" aria-live="polite">
                <figure class="gallery-slide is-active" role="group" aria-roledescription="slide"
                    aria-label="1 of 4">
                    <img src="assets/nails1.jpg" alt="Red and black nail art" />
                    <figcaption>Red and black nail art</figcaption>
                </figure>
                <figure class="gallery-slide" role="group" aria-roledescription="slide" aria-label="2 of 4"
                    aria-hidden="true">
                    <img src="assets/nails2.jpg" alt="Red and pink marbled nail art" />
                    <figcaption>Red and pink marbled nail art</figcaption>
                </figure>
                <figure class="gallery-slide" role="group" aria-roledescription="slide" aria-label="3 of 4"
                    aria-hidden="true">
                    <img src="assets/nails3.jpg" alt="Blue chrome nail art" />
                    <figcaption>Blue chrome nail art</figcaption>
                </figure>
                <figure class="gallery-slide" role="group" aria-roledescription="slide" aria-label="4 of 4"
                    aria-hidden="true">
                    <img src="assets/nails4.jpg" alt="Colorful chrome nail art" />
                    <figcaption>Colorful chrome nail art</figcaption>
                </figure>
            </div>
            <button class="gallery-control gallery-control-previous" type="button"
                aria-label="Previous nail design">&#8249;</button>
            <button class="gallery-control gallery-control-next" type="button"
                aria-label="Next nail design">&#8250;</button>
            <div class="gallery-pagination" aria-label="Choose a nail design">
                <button class="gallery-dot" type="button" aria-label="Show nail design 1" aria-current="true"></button>
                <button class="gallery-dot" type="button" aria-label="Show nail design 2" aria-current="false"></button>
                <button class="gallery-dot" type="button" aria-label="Show nail design 3" aria-current="false"></button>
                <button class="gallery-dot" type="button" aria-label="Show nail design 4" aria-current="false"></button>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-links footer-social">
            <a class="footer-link" href="https://www.facebook.com/pinkiebabe1202" target="_blank" rel="noopener noreferrer" aria-label="PinkieBabe Nails on Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M14 8V6.5c0-.7.2-1 1.1-1H17V2h-2.6C11.4 2 10 3.7 10 6.2V8H8v3.5h2V22h4V11.5h2.7L17 8h-3z"/></svg>
                <span>Facebook</span>
            </a>
            <a class="footer-link" href="https://www.instagram.com/pinkiebabe3/" target="_blank" rel="noopener noreferrer" aria-label="PinkieBabe Nails on Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></svg>
                <span>Instagram</span>
            </a>
        </div>
        <p class="copyright">&copy; 2026 PinkieBabe Nails</p>
        <div class="footer-links footer-contact">
            <a class="footer-link" href="https://maps.app.goo.gl/qrxSX38ir34HfCmG9" target="_blank" rel="noopener noreferrer" aria-label="Find PinkieBabe Nails on Google Maps">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                <span>Google Maps</span>
            </a>
            <a class="footer-link" href="mailto:pinkiebabenails@gmail.com" aria-label="Email PinkieBabe Nails at pinkiebabenails@gmail.com">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                <span>pinkiebabenails@gmail.com</span>
            </a>
        </div>
    </footer>
</body>
</html>
