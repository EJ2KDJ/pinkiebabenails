<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff4f6" />
    <meta name="robots" content="noindex" />
    <title>Owner sign in | PinkieBabe Nails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <script src="js/admin-login.js" defer></script>
</head>

<body>
    <header class="site-header">
        <a class="site-brand" href="index.html" aria-label="PinkieBabe Nails home">
            <img src="assets/Logo%20Nail%20salon.jpg" alt="PinkieBabe Nails" />
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
        </nav>
    </header>

    <section class="page-header">
        <p class="eyebrow">PinkieBabe Nails</p>
        <h1>Owner sign in</h1>
        <p>Sign in to manage salon inquiries.</p>
    </section>

    <main class="content-section auth-content">
        <section class="auth-card">
            <form id="admin-login-form" class="inquiry-form" novalidate>
                <div class="form-field">
                    <label for="email">Owner email</label>
                    <input id="email" name="email" type="email" autocomplete="username" required />
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="password-input">
                        <input id="password" name="password" type="password" autocomplete="current-password"
                            maxlength="72" required />
                        <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <p class="form-status" id="admin-login-status" role="status" aria-live="polite"></p>
                <button class="button" id="admin-login-submit" type="submit">Sign in to dashboard</button>
                <a class="auth-back-link" href="login.html?mode=forgot">Forgot your password?</a>
                <a class="auth-back-link" href="login.html">Customer sign in</a>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p class="copyright">&copy; 2026 PinkieBabe Nails</p>
    </footer>
</body>

</html>
