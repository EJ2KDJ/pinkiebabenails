<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff4f6" />
    <meta name="robots" content="noindex" />
    <title>Owner dashboard | PinkieBabe Nails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <script src="js/auth-session.js"></script>
    <script src="js/admin.js" defer></script>
    <script src="js/auth-nav.js" defer></script>
</head>

<body>
    <header class="site-header admin-header">
        <a class="site-brand" href="index.html" aria-label="PinkieBabe Nails home">
            <img src="assets/Logo%20Nail%20salon.jpg" alt="PinkieBabe Nails" />
        </a>
        <p class="admin-title">Owner dashboard</p>
        <input class="nav-toggle" type="checkbox" id="nav-toggle" />
        <label class="nav-toggle-button" for="nav-toggle">
            <span></span>
            <span></span>
            <span></span>
            <span class="visually-hidden">Toggle navigation</span>
        </label>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="admin-main" hidden id="dashboard">
        <section aria-labelledby="inquiries-heading">
            <div class="admin-toolbar">
                <div>
                    <p class="eyebrow">Messages from the website</p>
                    <h1 id="inquiries-heading">Inquiries</h1>
                </div>
                <button class="button button-outline admin-refresh" id="refresh-button" type="button">Refresh</button>
            </div>

            <div class="inquiry-search-controls" role="search" aria-label="Search inquiries">
                <label class="visually-hidden" for="inquiry-filter-type">Search by</label>
                <select id="inquiry-filter-type" aria-label="Search by">
                    <option value="name">Name</option>
                    <option value="email">Email</option>
                    <option value="date">Date</option>
                    <option value="service">Service</option>
                </select>
                <label class="visually-hidden" for="inquiry-filter-value">Search value</label>
                <input id="inquiry-filter-value" type="search" placeholder="Search by name" />
                <select id="inquiry-service-value" aria-label="Select service" hidden>
                    <option value="">All services</option>
                </select>
                <button class="button button-outline filter-clear" id="clear-filters" type="button">Clear</button>
            </div>
            <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter inquiries by status"></div>
            <p class="inquiry-result-count" id="inquiry-result-count" aria-live="polite"></p>
            <p class="form-status" id="dashboard-status" role="status" aria-live="polite"></p>
            <div class="inquiry-list" id="inquiry-list"></div>
        </section>
    </main>

    <p class="admin-loading" id="loading">Loading...</p>

    <footer class="site-footer">
        <p class="copyright">&copy; 2026 PinkieBabe Nails</p>
    </footer>
</body>

</html>
